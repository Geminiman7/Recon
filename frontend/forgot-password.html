<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Recon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="login-wrapper">
        <section class="login-card card">
            <div class="logo">Recon<span>Flow</span></div>
            <h1>Reset your password</h1>
            <p>Enter your email and we’ll send a reset link.</p>
            <form id="forgotPasswordForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input id="email" type="email" autocomplete="email" required>
                </div>
                <button class="btn btn-primary" type="submit">Send reset link</button>
            </form>
            <p class="auth-footer"><a href="/login">Back to sign in</a></p>
            <p id="formMessage" class="form-message" aria-live="polite"></p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/password-reset.js"></script>
</body>
</html>
