# LEGACY ONLY: New Railway services cannot use Config as Code.
# Existing support ends 2026-12-01. Use dashboard settings in RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/Dockerfile.frontend"

[deploy]
healthcheckPath = "/nginx-health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
