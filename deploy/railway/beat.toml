# LEGACY ONLY: New Railway services cannot use Config as Code.
# Existing support ends 2026-12-01. Use dashboard settings in RAILWAY.md.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "celery -A app.core.celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule"
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
