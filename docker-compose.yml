name: recon

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-recon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-recon}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  RECONCILIATION_MODE: async
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  ENVIRONMENT: production
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_PREFIX: ${S3_PREFIX:-recon}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
  S3_KMS_KEY_ID: ${S3_KMS_KEY_ID:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
  PAYSTACK_PRO_PLAN_CODE: ${PAYSTACK_PRO_PLAN_CODE:-}
  PAYSTACK_PRO_ANNUAL_PLAN_CODE: ${PAYSTACK_PRO_ANNUAL_PLAN_CODE:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
  MAX_SPREADSHEET_ROWS: ${MAX_SPREADSHEET_ROWS:-200000}
  MAX_SPREADSHEET_COLUMNS: ${MAX_SPREADSHEET_COLUMNS:-200}
  MAX_XLSX_EXPANDED_BYTES: ${MAX_XLSX_EXPANDED_BYTES:-268435456}
  EXPORT_MAX_ROWS: ${EXPORT_MAX_ROWS:-200000}
  EXPORT_MAX_BYTES: ${EXPORT_MAX_BYTES:-104857600}
  EXPORT_TTL_HOURS: ${EXPORT_TTL_HOURS:-24}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost}

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: Dockerfile
  image: recon-backend:${IMAGE_TAG:-latest}
  restart: unless-stopped
  init: true
  cpus: ${API_CPUS:-2.0}
  mem_limit: ${API_MEMORY:-2g}
  pids_limit: 256
  environment: *backend-environment
  volumes:
    - uploads:/app/app/storage/uploads
    - exports:/app/app/storage/exports
  networks:
    - backend
    - egress
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:16-alpine
    cpus: ${DB_CPUS:-2.0}
    mem_limit: ${DB_MEMORY:-2g}
    command: ["postgres", "-c", "max_connections=${DB_MAX_CONNECTIONS:-100}"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-recon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    cpus: ${REDIS_CPUS:-0.5}
    mem_limit: ${REDIS_MEMORY:-768m}
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend-service
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "${API_WORKERS:-2}", "--proxy-headers", "--forwarded-allow-ips=${API_TRUSTED_PROXY_CIDRS:-172.30.0.0/24}"]
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 7s
      retries: 4
      start_period: 30s
    stop_grace_period: 45s

  worker:
    <<: *backend-service
    cpus: ${WORKER_CPUS:-2.0}
    mem_limit: ${WORKER_MEMORY:-3g}
    environment:
      <<: *backend-environment
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-0}
    command: ["celery", "-A", "app.core.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-2}", "--max-tasks-per-child=50", "--time-limit=1800", "--soft-time-limit=1740"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app:celery_app inspect ping --destination celery@$${HOSTNAME} --timeout 5 | grep pong"]
      interval: 30s
      timeout: 10s
      retries: 4
      start_period: 30s
    stop_grace_period: 35m

  scheduler:
    <<: *backend-service
    cpus: 0.25
    mem_limit: 256m
    command: ["celery", "-A", "app.core.celery_app:celery_app", "beat", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    image: nginx:1.27-alpine
    cpus: ${FRONTEND_CPUS:-0.5}
    mem_limit: ${FRONTEND_MEMORY:-256m}
    restart: unless-stopped
    init: true
    ports:
      - "${HTTP_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - backend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 4
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
  backend:
    internal: true
    ipam:
      config:
        - subnet: ${BACKEND_SUBNET:-172.30.0.0/24}
  egress:

volumes:
  pgdata:
  redisdata:
  uploads:
  exports:
