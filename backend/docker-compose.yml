# =============================================================================
# Recon - Production Docker Compose Orchestration
# =============================================================================
# Services:
#   - postgres   : PostgreSQL database with persistent volume
#   - redis      : Redis message broker and result backend
#   - api        : FastAPI application server
#   - worker     : Celery background worker for async tasks
#   - flower     : Celery monitoring dashboard (optional, can be disabled)
# =============================================================================

version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-restart: &default-restart
  condition: on-failure
  delay: 5s
  max_attempts: 5
  window: 120s

networks:
  recon-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  uploads-data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: recon-postgres
    restart: *default-restart
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recon}
      POSTGRES_DB: ${POSTGRES_DB:-recon}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      recon-net:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recon} -d ${POSTGRES_DB:-recon}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: recon-redis
    restart: *default-restart
    logging: *default-logging
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-recon-redis-secret}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --save 30 1000
      --appendonly yes
      --appendfsync everysec
      --notify-keyspace-events ""
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      recon-net:
        ipv4_address: 172.28.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-recon-redis-secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: recon-api
    restart: *default-restart
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
    environment: &fallback-environment
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-recon}:${POSTGRES_PASSWORD:-recon}@postgres:5432/${POSTGRES_DB:-recon}
      REDIS_URL: redis://:${REDIS_PASSWORD:-recon-redis-secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      FRONTEND_URL: ${FRONTEND_URL:-http://127.0.0.1:5500}
      RECONCILIATION_MODE: ${RECONCILIATION_MODE:-async}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_ROOT: /app/storage/uploads
      SENTRY_DSN: ${SENTRY_DSN:-}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      PAYSTACK_PRO_PLAN_CODE: ${PAYSTACK_PRO_PLAN_CODE:-}
      PAYSTACK_PRO_ANNUAL_PLAN_CODE: ${PAYSTACK_PRO_ANNUAL_PLAN_CODE:-}
      PAYSTACK_WEBHOOK_SECRET: ${PAYSTACK_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-eu-west-1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-eu-west-1}
    volumes:
      - uploads-data:/app/storage/uploads
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      recon-net:
        ipv4_address: 172.28.0.20
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    entrypoint: ["/app/entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: runtime
      args:
        - BUILDKIT_INLINE_CACHE=1
    container_name: recon-worker
    restart: *default-restart
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-recon}:${POSTGRES_PASSWORD:-recon}@postgres:5432/${POSTGRES_DB:-recon}
      REDIS_URL: redis://:${REDIS_PASSWORD:-recon-redis-secret}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RECONCILIATION_MODE: async
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      UPLOAD_ROOT: /app/storage/uploads
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    volumes:
      - uploads-data:/app/storage/uploads
    networks:
      recon-net:
        ipv4_address: 172.28.0.21
    entrypoint: ["/app/worker-entrypoint.sh"]
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  fallback-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: runtime
    restart: *default-restart
    logging: *default-logging
    environment: *fallback-environment
    entrypoint: ["python", "-m", "app.workers.fallback_worker"]
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
    volumes:
      - uploads-data:/app/storage/uploads
    networks:
      - recon-net
    healthcheck:
      test: ["CMD", "python", "-c", "from app.core.database import SessionLocal; from app.workers.fallback_worker import healthy; db = SessionLocal(); raise SystemExit(0 if healthy(db) else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
    stop_grace_period: 35m

  flower:
    image: mher/flower:2.0.1
    container_name: recon-flower
    restart: *default-restart
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-recon-redis-secret}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-recon-redis-secret}@redis:6379/0
      FLOWER_PORT: 5555
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
      FLOWER_PURGE_OFFLINE_WORKERS: 1
    ports:
      - "127.0.0.1:5555:5555"
    networks:
      recon-net:
        ipv4_address: 172.28.0.22
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    profiles:
      - monitoring
